# Builds an installable (debug-keystore-signed) Android APK for the BCn/Mali fix branch.
# Runs on pushes to the fix branch or manually from the Actions tab.
name: Android APK

on:
  push:
    branches: [bcn-mali-nce-fixes-v2]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android/sdk/ndk/2[0-6].* /usr/local/share/boost
          df -h /

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install glslang (host shader compiler required by CMake)
        run: sudo apt-get update && sudo apt-get install -y glslang-tools

      - name: Accept Android SDK licenses
        run: yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build (standard flavor, Release, arm64-v8a)
        run: sh .ci/android/build.sh -t standard -b Release

      - uses: actions/upload-artifact@v4
        with:
          name: eden-bcn-mali-fix-apk
          path: |
            artifacts/*.apk
            artifacts/*.aab
          if-no-files-found: error
